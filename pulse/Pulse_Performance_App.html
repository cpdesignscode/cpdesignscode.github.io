    var qty=0,m,re=/(\d+)\s*x?\s*crep/gi; while((m=re.exec(low)))qty+=parseInt(m[1],10);
    var re2=/crep\s*x?\s*(\d+)/gi; while((m=re2.exec(low)))qty+=parseInt(m[1],10);
    var cnt=(low.match(/crep/g)||[]).length; qty=Math.max(qty,cnt,1);
    return {kind:"crep",name:name,qty:qty,raw:line};
  }
  /* kiosk */
  var amts=[],a=/\u00a3\s*(\d+(?:\.\d+)?)|(\d+(?:\.\d+)?)\s*\u00a3/g;
  while((m=a.exec(line)))amts.push(parseFloat(m[1]||m[2]));
  if(!amts.length)return null;
  if(!name)return {kind:"ambiguous",raw:line,type:"kiosk"};
  var sum=0,tx=0;for(var j=0;j<amts.length;j++){sum+=amts[j];if(amts[j]>0)tx++;}
  return {kind:"kiosk",name:name,amt:Math.round(sum*100)/100,txn:tx,raw:line};
}

function commitParsed(items,sender){
  var added=0,revs=0;
  for(var i=0;i<items.length;i++){var it=items[i];
    if(it.kind==="crep"){var e=ensureEmp(it.name);e.crep+=it.qty;
      var ev={id:uid(),ts:Date.now(),sender:sender,name:it.name,type:"crep",qty:it.qty,raw:it.raw,reversed:false};
      state.events.push(ev);added++;}
    else if(it.kind==="kiosk"){var e2=ensureEmp(it.name);e2.kiosk=Math.round((e2.kiosk+it.amt)*100)/100;e2.txn+=it.txn;
      var ev2={id:uid(),ts:Date.now(),sender:sender,name:it.name,type:"kiosk",amt:it.amt,txn:it.txn,raw:it.raw,reversed:false};
      state.events.push(ev2);added++;}
    else if(it.kind==="dgt"){
      var target=null,mode="typist";
      for(var k=state.events.length-1;k>=0;k--){var ev3=state.events[k];if(!ev3.reversed&&!ev3._pendingRev&&ev3.sender===sender){target=ev3;break;}}
      if(!target){mode="floor-fallback";for(var k2=state.events.length-1;k2>=0;k2--){var e4=state.events[k2];if(!e4.reversed&&!e4._pendingRev){target=e4;break;}}}
      if(target){target._pendingRev=true;
        state.reversals.push({id:uid(),eventId:target.id,name:target.name,type:target.type,
          what:(target.type==="crep"?target.qty+" crep":gbp(target.amt)+" kiosk"),mode:mode,status:"pending",by:sender,ts:Date.now()});
        revs++;}
    }
  }
  save();return {added:added,revs:revs};
}
function approveReversal(id){
  var r=find(state.reversals,id);if(!r||r.status!=="pending")return;
  var ev=findEvent(r.eventId);if(ev){ev.reversed=true;ev._pendingRev=false;var e=findEmp(ev.name);
    if(e){if(ev.type==="crep")e.crep=Math.max(0,e.crep-ev.qty);else{e.kiosk=Math.round((e.kiosk-ev.amt)*100)/100;e.txn=Math.max(0,e.txn-ev.txn);}}}
  r.status="approved";r.decidedTs=Date.now();save();
}
function rejectReversal(id){var r=find(state.reversals,id);if(!r||r.status!=="pending")return;var ev=findEvent(r.eventId);if(ev)ev._pendingRev=false;r.status="rejected";r.decidedTs=Date.now();save();}
function pendingCount(){var n=0;for(var i=0;i<state.reversals.length;i++)if(state.reversals[i].status==="pending")n++;return n;}

/* ---------- compute ---------- */
function maxBy(arr,f){var m=0;for(var i=0;i<arr.length;i++)m=Math.max(m,f(arr[i]));return m||1;}
function scored(weight){
  var mc=maxBy(state.employees,function(e){return e.crep;}),mk=maxBy(state.employees,function(e){return e.kiosk;});
  return state.employees.map(function(e){var s=(weight*(e.crep/mc)+(1-weight)*(e.kiosk/mk))*100;
    var o={name:e.name,crep:e.crep,kiosk:e.kiosk,txn:e.txn,wk_crep:e.wk_crep,eps:Math.round(s*10)/10};return o;});
}
function totals(){var c=0,k=0,t=0;for(var i=0;i<state.employees.length;i++){c+=state.employees[i].crep;k+=state.employees[i].kiosk;t+=state.employees[i].txn;}
  return {crep:c,kiosk:Math.round(k*100)/100,txn:t};}
function storeScore(){
  var o=state.official, T=totals();
  /* attainment vs simple targets (configurable placeholders) */
  function at(v,tg){return Math.min(v/tg,1.25)*100;}
  var parts=[[at(o.gross_sales,470000),20],[at(o.transactions,6800),15],[at(o.conversion,16.9),15],
    [at(o.atv,74),10],[at(o.upt,1.74),10],[at(T.crep,440),10],[at(o.kiosk_ptn,5.0),10],[at(o.status_atv||78,80),10]];
  var num=0,den=0;for(var i=0;i<parts.length;i++){num+=Math.min(parts[i][0],100)*parts[i][1];den+=parts[i][1];}
  return Math.round(num/den);
}
function consistency(e){var w=e.wk_crep.filter(function(x){return x>0;});if(w.length<2)return 999;
  var mean=w.reduce(function(a,b){return a+b;},0)/w.length;var v=w.reduce(function(a,b){return a+(b-mean)*(b-mean);},0)/w.length;
  return Math.sqrt(v)/mean;}
function rising(e){var w=e.wk_crep;var first=w[0]||0,last=0;for(var i=w.length-1;i>=0;i--){if(w[i]>0){last=w[i];break;}}return first?((last-first)/first):(last>0?1:0);}
function recognition(){
  var list=scored(0.5);
  function top(f){var b=null;for(var i=0;i<list.length;i++)if(!b||f(list[i])>f(b))b=list[i];return b;}
  var eotm=top(function(e){return e.eps;});
  var topCrep=top(function(e){return e.crep;});
  var topKiosk=top(function(e){return e.kiosk;});
  var risers=list.filter(function(e){return e.crep>0;});
  var star=null;for(var i=0;i<risers.length;i++){if(!star||rising(risers[i])>rising(star))star=risers[i];}
  var cons=null;for(var j=0;j<list.length;j++){if(list[j].crep>0&&consistency(list[j])<(cons?consistency(cons):999))cons=list[j];}
  return {eotm:eotm,topCrep:topCrep,topKiosk:topKiosk,star:star,cons:cons};
}
function coachInsights(){
  var o=state.official,out=[];
  if(o.conv_var<0)out.push({id:"conv",sev:"warn",t:"Conversion is down "+o.conv_var+"pt",
    p:"Conversion "+o.conversion+"% vs "+(o.conversion-o.conv_var).toFixed(2)+"% LY while footfall is up "+o.foot_var+"%. Convert the traffic: greeters on the door, fitting-room discipline, queue-bust at peak (13:00\u201317:00).",tgt:"Target 16.9%"});
  if(o.atv_var<0)out.push({id:"atv",sev:"warn",t:"ATV dropped "+o.atv_var+"%",
    p:"ATV "+o.atv+" vs "+(o.atv/(1+o.atv_var/100)).toFixed(2)+" LY. Push multi-buy and higher-value footwear; coach add-ons (Crep, laces, socks) at the till.",tgt:"Target ATV \u00a374"});
  if(o.foot_var>0)out.push({id:"foot",sev:"up",t:"Footfall surging +"+o.foot_var+"%",
    p:"Traffic is up sharply. Opportunity: roster +1 on the floor 12:00\u201318:00, protect conversion, brief the team on Crep attach.",tgt:"Hold conversion \u2265 LY"});
  if(o.kiosk_ptn<5)out.push({id:"kiosk",sev:"warn",t:"Kiosk penetration below 5%",
    p:"Kiosk PTN "+o.kiosk_ptn+"%. Share the pitch from top sellers (Kian, Rowan), place a kiosk prompt at the till, set a weekly \u00a3 target per colleague.",tgt:"Target PTN 5.0%"});
  if(o.proof_var>20)out.push({id:"proof",sev:"up",t:"Proofers/Crep strong +"+o.proof_var+"%",
    p:"Crep attach is excellent. Lock it in: make top sellers Crep buddies for new starters; set a stretch strike-rate of 1:4.",tgt:"Strike 1:4"});
  return out.filter(function(c){return state.coachDismissed.indexOf(c.id)<0;});
}

/* ---------- helpers ---------- */
function uid(){return "x"+Math.random().toString(36).slice(2,9);}
function find(arr,id){for(var i=0;i<arr.length;i++)if(arr[i].id===id)return arr[i];return null;}
function findEvent(id){return find(state.events,id);}
function gbp(n){return "\u00a3"+Math.round(n).toLocaleString();}
function fmt(n){return Number(n).toLocaleString();}
function esc(s){return String(s).replace(/[&<>]/g,function(c){return {"&":"&amp;","<":"&lt;",">":"&gt;"}[c];});}
function toast(msg){var t=document.getElementById("toast");t.innerHTML='<div class="toast">'+msg+'</div>';setTimeout(function(){t.innerHTML="";},2600);}
function can(perm){var r=state.user.role;
  if(perm==="regional")return r==="Area Manager";
  if(perm==="approve")return r==="Store Manager"||r==="Area Manager";
  if(perm==="log")return r!=="Sales Assistant";
  if(perm==="publish")return r!=="Sales Assistant";
  return true;}

    med("gold","\uD83D\uDCB7","Top Kiosk",r.topKiosk?r.topKiosk.name+" \u00b7 "+gbp(r.topKiosk.kiosk):"\u2014")+
    med("","\u2B50","Rising Star",r.star?r.star.name:"\u2014")+
    med("","\uD83D\uDD25","Consistency",r.cons?r.cons.name:"\u2014")+
    med("","\uD83C\uDFAF","Status Champ","pending data")+
    '</div>';
  h+='<p class="note">EOTM & Best score use Crep + Kiosk (the data captured). Rising Star = biggest week-on-week Crep gain; Consistency = steadiest weekly Crep. Status Champion and attendance activate once those feeds are connected.</p>';

};

var ANT="Anton,Impact,sans-serif",MAN="Manrope,system-ui,sans-serif";

pages.coach=function(){
  var ci=coachInsights();
  var h='<div class="topline"><div><div class="ey">Intelligence</div><h1 class="h">AI Store Coach</h1><div class="sub">Recommendations from this period\u2019s KPI movements</div></div></div>';
  if(!ci.length)h+='<div class="alert success" style="margin-top:14px"><span>\u2713</span><div>All clear \u2014 no flagged metrics right now. Dismissed insights reset if the data changes.</div></div>';

    h+='<div class="coachcard '+c.sev+'" style="margin-top:14px"><h4>'+(c.sev==="warn"?"\u26A0 ":"\u25B2 ")+esc(c.t)+'</h4><p>'+c.p+'</p><div class="tgt">'+c.tgt+'</div>'+
       '<div class="demorow" style="margin-top:11px"><button class="btn primary sm" data-act="coachok" data-id="'+c.id+'">Accept</button><button class="btn ghost sm" data-act="coachdismiss" data-id="'+c.id+'">Dismiss</button></div></div>';}
  return h;
};

pages.regional=function(){
  if(!can("regional"))return '<div class="alert error" style="margin-top:14px"><span>\u26A0</span><div>Regional view is Area Manager only.</div></div>';
  var stores=[{n:"0007 Riverside",s:storeScore(),crep:totals().crep,trend:"up"},
    {n:"0035 Brookfield",s:71,crep:388,trend:"down"},{n:"0058 Fairview",s:83,crep:512,trend:"up"},
    {n:"0072 Elmwood",s:69,crep:341,trend:"down"},{n:"0091 Kingsgate",s:74,crep:402,trend:"up"}];

  h+='<div class="sec">Store League</div><div class="tbl">';

    h+='<div class="lbrow"><div class="rk">'+(i+1)+'</div><div><div class="nm">'+esc(st.n)+'</div><div class="bar"><i style="width:'+st.s+'%"></i></div></div><div class="num">'+st.s+'<small>'+st.crep+' crep '+(st.trend==="up"?"\u25B2":"\u25BC")+'</small></div></div>';}
  h+='</div><p class="note">Other stores shown with sample figures for demonstration. Connecting their exports populates the league with live data \u2014 same engine, multiplied across the area.</p>';

/* ---------- ROUTER ---------- */
var current="dashboard";
function go(p){current=p;renderNav(p);document.getElementById("main").innerHTML=pages[p]?pages[p]():"";window.scrollTo(0,0);
  if(p==="leaderboard")bindSlider();}
function bindSlider(){var wt=document.getElementById("wt");if(!wt)return;
  wt.addEventListener("input",function(){weight=this.value/100;var c=Math.round(weight*100);
    var t=document.getElementById("wtxt");if(t)t.textContent=c+"% Crep / "+(100-c)+"% Kiosk";
    /* re-render list only */ go("leaderboard");
    var w2=document.getElementById("wt");if(w2){w2.focus();}},false);}

/* ---------- LOGGER actions ---------- */
function doParse(){
  var box=document.getElementById("logbox");if(!box)return;
  var lines=box.value.split("\n");var items=[],amb=0;
  for(var i=0;i<lines.length;i++){var r=parseLine(lines[i],state.user.name);if(r)items.push(r);}
  pendingPreview=items;
  var pv=document.getElementById("preview");var html="";var ok=0;
  for(var j=0;j<items.length;j++){var it=items[j];
    if(it.kind==="crep"){html+='<div>\u2714 '+esc(it.name)+' \u00b7 <b>Crep \u00d7'+it.qty+'</b></div>';ok++;}
    else if(it.kind==="kiosk"){html+='<div>\u2714 '+esc(it.name)+' \u00b7 <b>'+gbp(it.amt)+' Kiosk</b></div>';ok++;}
    else if(it.kind==="dgt"){html+='<div style="color:var(--err)">\u21A9 DGT \u2192 reverses your last sale <span class="chip warn">pending approval</span></div>';}
    else if(it.kind==="ambiguous"){html+='<div style="color:var(--warn)">\u26A0 \u201C'+esc(it.raw)+'\u201D \u2014 no recognised name, skipped</div>';amb++;}
  }
  if(!items.length)html='<span style="color:var(--mut)">No valid entries found. Try \u201CAsma x2 crep\u201D.</span>';
  pv.innerHTML=html;
  var cb=document.getElementById("commitbar");
  if(ok||items.some(function(x){return x.kind==="dgt";}))cb.innerHTML='<div style="border-top:1px solid var(--line);margin-top:12px;padding-top:12px"><button class="btn primary" data-act="commit" style="width:100%">Commit '+ok+' entr'+(ok===1?"y":"ies")+(items.some(function(x){return x.kind==="dgt";})?" + DGT":"")+'</button></div>';
  else cb.innerHTML="";
}
function doCommit(){
  if(!pendingPreview)return;
  var res=commitParsed(pendingPreview.filter(function(x){return x.kind==="crep"||x.kind==="kiosk"||x.kind==="dgt";}),state.user.name);
  pendingPreview=null;
  toast(res.added+" logged"+(res.revs?" \u00b7 "+res.revs+" DGT pending":""));
  go(current==="logger"?"logger":current);renderNav(current);
}

/* ---------- poster download ---------- */
function downloadPoster(fmt){
  var svg=document.getElementById("postersvg");if(!svg)return;
  var data=new XMLSerializer().serializeToString(svg);
  if(fmt==="svg"){dl("jd_poster.svg","data:image/svg+xml;charset=utf-8,"+encodeURIComponent(data));return;}
  var img=new Image();var blob=new Blob([data],{type:"image/svg+xml"});var url=URL.createObjectURL(blob);
  img.onload=function(){var c=document.createElement("canvas");c.width=1200;c.height=1400;var ctx=c.getContext("2d");
    ctx.fillStyle="#000";ctx.fillRect(0,0,1200,1400);ctx.drawImage(img,0,0,1200,1400);URL.revokeObjectURL(url);
    try{dl("jd_poster.png",c.toDataURL("image/png"));}catch(e){toast("Download blocked \u2014 open in a browser");}};
  img.onerror=function(){toast("Render failed \u2014 try SVG");};img.src=url;
}
function dl(name,href){var a=document.createElement("a");a.download=name;a.href=href;document.body.appendChild(a);a.click();a.remove();}

/* ---------- delegated actions ---------- */
function closest(el,sel){while(el&&el.nodeType===1){if(el.matches?el.matches(sel):el.msMatchesSelector(sel))return el;el=el.parentNode;}return null;}
document.addEventListener("click",function(ev){
  var el=closest(ev.target,"[data-act]");if(!el)return;
  var act=el.getAttribute("data-act");
  if(act==="login"){doLogin();}
  else if(act==="logout"){state.user=null;save();document.getElementById("app").classList.add("hidden");document.getElementById("login").classList.remove("hidden");}
  else if(act==="go"){go(el.getAttribute("data-p"));}
  else if(act==="rank"){rankMode=el.getAttribute("data-m");go("leaderboard");}
  else if(act==="parse"){doParse();}
  else if(act==="commit"){doCommit();}
  else if(act==="loghelp"){var b=document.getElementById("logbox");if(b){b.value="Sana x2 crep\nTelson \u00a3220 kiosk\nChris x1 crep\nDGT";doParse();}}
  else if(act==="apr"){approveReversal(el.getAttribute("data-id"));toast("Reversal approved");go("dgt");renderNav("dgt");}
  else if(act==="rej"){rejectReversal(el.getAttribute("data-id"));toast("Reversal rejected");go("dgt");renderNav("dgt");}
  else if(act==="publish"){state.recognitionPublished=true;save();toast("Recognition published to team \uD83C\uDF89");go("recognition");}
  else if(act==="dlposter"){downloadPoster(el.getAttribute("data-fmt"));}
  else if(act==="coachok"){toast("Action accepted \u2014 tracked for next period");}
  else if(act==="coachdismiss"){state.coachDismissed.push(el.getAttribute("data-id"));save();go("coach");}
  else if(act==="role"){/* handled below */}
},false);

/* role pick on login */
document.addEventListener("click",function(ev){var r=closest(ev.target,".role");if(!r)return;
  var els=document.querySelectorAll(".role");for(var i=0;i<els.length;i++)els[i].classList.remove("on");r.classList.add("on");},false);

function doLogin(){
  var name=(document.getElementById("lg-name").value||"Rowan").trim();
  var store=(document.getElementById("lg-store").value||"0007 Riverside").trim();
  var roleEl=document.querySelector(".role.on");var role=roleEl?roleEl.getAttribute("data-role"):"Store Manager";
  /* if logging-in name matches an employee, normalise */
  var low=name.toLowerCase();if(NAME_MAP[low])name=NAME_MAP[low];
  state.user={name:name,role:role};state.store=store;save();
  document.getElementById("brand-store").textContent=store;
  document.getElementById("ub-name").textContent=name;
  document.getElementById("ub-role").textContent=role;
  document.getElementById("ub-av").textContent=name.charAt(0).toUpperCase();
  document.getElementById("login").classList.add("hidden");
  document.getElementById("app").classList.remove("hidden");
  go("dashboard");
}

/* ---------- boot ---------- */
function boot(){
  try{
    initState();
    if(state.user){ /* resume session */
      document.getElementById("brand-store").textContent=state.store;
      document.getElementById("ub-name").textContent=state.user.name;
      document.getElementById("ub-role").textContent=state.user.role;
      document.getElementById("ub-av").textContent=state.user.name.charAt(0).toUpperCase();
      document.getElementById("login").classList.add("hidden");
      document.getElementById("app").classList.remove("hidden");
      go("dashboard");
    }
  }catch(e){
    document.getElementById("login").innerHTML='<div class="loginbox"><h1 class="h">Error</h1><p>'+(e&&e.message||e)+'</p><p>Open this file in Safari or Chrome.</p></div>';
  }
}
if(document.readyState==="loading")document.addEventListener("DOMContentLoaded",boot);else boot();
})();

</script>
